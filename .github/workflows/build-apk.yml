name: Stream V21 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stream-v21
  cancel-in-progress: true

jobs:
  build:
    name: Build Stream V21 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Create Android local.properties
        shell: bash
        run: |
          printf '%s\n' \
            "flutter.sdk=$FLUTTER_ROOT" \
            "sdk.dir=$ANDROID_HOME" \
            > android/local.properties

          echo "android/local.properties created"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Configure Gradle
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.vfs.watch=false
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          EOF

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "STREAM V21"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Checking required files..."

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "OK: pubspec.yaml"
          echo "OK: lib/"
          echo "OK: android/"
          echo "OK: settings.gradle.kts"
          echo "OK: app/build.gradle.kts"
          echo "OK: gradle-wrapper.properties"

      - name: Show Android configuration
        shell: bash
        run: |
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "========================================"
          echo "SETTINGS"
          echo "========================================"

          cat android/settings.gradle.kts

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          gradle --version

      - name: Flutter Doctor
        shell: bash
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      - name: Flutter Clean
        shell: bash
        run: |
          flutter clean

      - name: Flutter Pub Get
        shell: bash
        run: |
          flutter pub get

      - name: Precache Flutter Android
        shell: bash
        run: |
          flutter precache --android

      - name: Verify rtmp_streaming
        shell: bash
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          if [ ! -f "$PLUGIN" ]; then
            echo "ERROR: rtmp_streaming 2.0.1 was not found"
            exit 1
          fi

          echo "rtmp_streaming found:"
          echo "$PLUGIN"

          echo ""
          echo "Plugin build.gradle:"
          cat "$PLUGIN"

      - name: Patch rtmp_streaming
        shell: bash
        run: |
          set -e

          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          test -f "$PLUGIN"

          python3 - "$PLUGIN" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Replace legacy kotlinOptions block when present.
          pattern = re.compile(
              r'(?ms)^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}'
          )

          replacement = """    kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }"""

          text, count = pattern.subn(
              replacement,
              text,
              count=1
          )

          if count == 0:
              print("No legacy kotlinOptions block found; leaving plugin unchanged.")
          else:
              print("Legacy kotlinOptions block replaced.")

          # Ensure JitPack is available for RootEncoder.
          if "https://jitpack.io" not in text:
              text += """

          repositories {
              google()
              mavenCentral()
              maven {
                  url 'https://jitpack.io'
              }
          }
          """
              print("JitPack repository added.")
          else:
              print("JitPack repository already present.")

          path.write_text(text)
          PY

          echo ""
          echo "Patched plugin:"
          cat "$PLUGIN"

      - name: Flutter Analyze
        shell: bash
        run: |
          flutter analyze

      - name: Flutter Test
        shell: bash
        run: |
          flutter test

      - name: Build Stream V21 APK
        shell: bash
        env:
          GRADLE_OPTS: '-Dorg.gradle.vfs.watch=false -Dorg.gradle.daemon=false'
        run: |
          set -e

          echo "========================================"
          echo "BUILD STREAM V21 APK"
          echo "========================================"

          flutter build apk --release

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name '*.apk' \
            -print || true

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          APK="$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No APK was produced."

            echo ""
            echo "Build directory:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/Stream-V21-release.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/Stream-V21-release.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/artifacts/Stream-V21-release.apk"

          test -f "$APK"

          SIZE="$(stat -c%s "$APK")"

          echo "========================================"
          echo "APK VERIFIED"
          echo "========================================"

          echo "Path:"
          echo "$APK"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

      - name: Upload Stream V21 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V21-APK
          path: artifacts/Stream-V21-release.apk
          if-no-files-found: error
          retention-days: 30
