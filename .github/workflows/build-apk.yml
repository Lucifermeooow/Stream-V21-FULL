name: Stream V21 APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: stream-v21-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Stream V21 Release APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # 1. Checkout
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # 2. Java 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================
      # 3. Flutter
      # =========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      # =========================================
      # 4. Android SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # =========================================
      # 5. Android licenses
      # =========================================
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      # =========================================
      # 6. Create local.properties
      # =========================================
      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

          echo "android/local.properties:"
          cat android/local.properties

      # =========================================
      # 7. Setup Gradle
      # =========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # =========================================
      # 8. Disable Gradle file watching
      # =========================================
      - name: Configure Gradle
        run: |
          mkdir -p "$HOME/.gradle"

          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.vfs.watch=false
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
          EOF

      # =========================================
      # 9. Verify project
      # =========================================
      - name: Verify project
        run: |
          echo "========================================"
          echo "STREAM V21 PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Android:"
          ls -la android

          echo ""
          echo "Required files:"

          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Project structure OK."

      # =========================================
      # 10. Show Android configuration
      # =========================================
      - name: Show Android configuration
        run: |
          echo "========================================"
          echo "SETTINGS GRADLE"
          echo "========================================"

          cat android/settings.gradle.kts

          echo ""
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          cat android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          gradle --version

      # =========================================
      # 11. Flutter doctor
      # =========================================
      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          flutter doctor -v

      # =========================================
      # 12. Clean
      # =========================================
      - name: Flutter Clean
        run: |
          flutter clean

      # =========================================
      # 13. Dependencies
      # =========================================
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # =========================================
      # 14. Flutter Android artifacts
      # =========================================
      - name: Precache Flutter Android
        run: |
          flutter precache --android

      # =========================================
      # 15. Patch rtmp_streaming
      # =========================================
      - name: Patch rtmp_streaming 2.0.1
        shell: bash
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/rtmp_streaming-2.0.1/android/build.gradle"

          if [ ! -f "$PLUGIN" ]; then
            echo "ERROR: rtmp_streaming build.gradle not found."
            exit 1
          fi

          echo "========================================"
          echo "BEFORE RTMP PATCH"
          echo "========================================"

          nl -ba "$PLUGIN" | sed -n '1,120p'

          python3 - "$PLUGIN" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Replace any kotlinOptions block.
          text = re.sub(
              r'(?ms)^[ \t]*kotlinOptions[ \t]*\{.*?^[ \t]*\}',
              '''    kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }''',
              text,
              count=1
          )

          # Make sure JitPack is available.
          if "https://jitpack.io" not in text:
              text += """

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
}
"""

          path.write_text(text)
          print("rtmp_streaming patch completed.")
          PY

          echo ""
          echo "========================================"
          echo "AFTER RTMP PATCH"
          echo "========================================"

          nl -ba "$PLUGIN" | sed -n '1,130p'

      # =========================================
      # 16. Analyze
      # =========================================
      - name: Flutter Analyze
        run: |
          flutter analyze

      # =========================================
      # 17. Tests
      # =========================================
      - name: Flutter Test
        run: |
          flutter test

      # =========================================
      # 18. Build APK
      # =========================================
      - name: Build Stream V21 APK
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.vfs.watch=false
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx4G
        run: |
          set -e

          echo "========================================"
          echo "BUILD STREAM V21 APK"
          echo "========================================"

          flutter build apk --release

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print || true

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          APK=$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build directory contents:"
            find "$GITHUB_WORKSPACE/build" \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/Stream-V21-release.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh "$GITHUB_WORKSPACE/artifacts/Stream-V21-release.apk"

      # =========================================
      # 19. Verify APK
      # =========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/artifacts/Stream-V21-release.apk"

          test -f "$APK"

          SIZE=$(stat -c%s "$APK")

          echo "========================================"
          echo "APK VERIFIED"
          echo "========================================"

          echo "File:"
          echo "$APK"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: APK is suspiciously small."
            exit 1
          fi

      # =========================================
      # 20. Upload APK
      # =========================================
      - name: Upload Stream V21 APK
        uses: actions/upload-artifact@v4
        with:
          name: Stream-V21-APK
          path: artifacts/Stream-V21-release.apk
          if-no-files-found: error
          retention-days: 30
